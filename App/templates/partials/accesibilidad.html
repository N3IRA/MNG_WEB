{% load static %}
<link rel="stylesheet" href="{% static 'css/accesibilidad.css' %}">
{% csrf_token %}
{{ request.session.a11y_settings|json_script:"a11y-session-data" }}
<!-- ── Botón flotante de Accesibilidad ── -->
<button
  id="a11y-btn"
  onclick="A11y.toggle()"
  aria-label="Opciones de accesibilidad"
  aria-expanded="false"
  class="btn a11y-btn-main position-fixed shadow-lg p-0 d-flex align-items-center justify-content-center rounded-circle"
>
  <i class="bi bi-universal-access fs-4" aria-hidden="true"></i>
</button>

<!-- ── Panel de Accesibilidad ── -->
<div
  id="a11y-panel"
  class="card a11y-panel position-fixed d-none shadow-lg"
  role="dialog"
  aria-modal="true"
  aria-label="Panel de accesibilidad"
>
  <!-- Header del Panel con Botón Reset y Cerrar -->
  <div
    class="a11y-panel-header d-flex justify-content-between align-items-center px-3 py-2 border-bottom"
  >
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-universal-access fs-5 a11y-header-icon" aria-hidden="true"></i>
      <span class="fw-bold text-white">Accesibilidad</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-sm btn-a11y-action py-1 px-2 border-0"
        id="btn-reset"
        title="Restablecer todas las opciones"
      >
        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        <span class="d-none d-sm-inline ms-1">Restablecer</span>
      </button>
      <button
        class="btn btn-sm btn-a11y-action py-1 px-2 border-0 a11y-panel-close-btn"
        id="btn-close-a11y"
        onclick="A11y.toggle()"
        title="Cerrar panel de accesibilidad"
        aria-label="Cerrar panel de accesibilidad"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- Barra de Navegación (Tabs) -->
  <div class="a11y-tabs-nav border-bottom d-flex" role="tablist">
    <button
      class="a11y-tab-btn a11y-tab-active"
      id="tab-tamano"
      role="tab"
      aria-selected="true"
      aria-controls="panel-tamano"
    >
      <i class="bi bi-fonts"></i>
      <span>Tamaño</span>
    </button>
    <button
      class="a11y-tab-btn"
      id="tab-lectura"
      role="tab"
      aria-selected="false"
      aria-controls="panel-lectura"
    >
      <i class="bi bi-book"></i>
      <span>Lectura</span>
    </button>
    <button
      class="a11y-tab-btn"
      id="tab-animaciones"
      role="tab"
      aria-selected="false"
      aria-controls="panel-animaciones"
    >
      <i class="bi bi-play-circle"></i>
      <span>Animaciones</span>
    </button>
  </div>

  <!-- Contenido del Panel -->
  <div class="a11y-panel-content p-3 d-flex flex-column gap-3">
    <!-- TAB 1: Tamaño -->
    <div
      id="panel-tamano"
      class="a11y-tab-panel a11y-tab-panel-active"
      role="tabpanel"
      aria-labelledby="tab-tamano"
    >
      <!-- Brillo -->
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="sl-bright" class="form-label small mb-0"
            ><i class="bi bi-brightness-high text-warning"></i> Brillo</label
          >
          <span class="small fw-bold" id="val-bright">100%</span>
        </div>
        <input
          type="range"
          class="form-range form-range-sm"
          id="sl-bright"
          min="50"
          max="120"
          value="100"
          step="1"
        />
      </div>

      <!-- Tamaño de texto -->
      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="sl-font" class="form-label small mb-0"
            ><i class="bi bi-textbox a11y-green-icon"></i> Texto</label
          >
          <span class="small fw-bold" id="val-font">100%</span>
        </div>
        <input
          type="range"
          class="form-range form-range-sm"
          id="sl-font"
          min="80"
          max="190"
          value="100"
          step="1"
        />
      </div>
    </div>

    <!-- TAB 2: Lectura -->
    <div
      id="panel-lectura"
      class="a11y-tab-panel"
      role="tabpanel"
      aria-labelledby="tab-lectura"
    >
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-focus" />
        <label class="form-check-label small" for="tog-focus"><i class="bi bi-align-center a11y-green-icon"></i> Guía de Lectura</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-dyslexic" />
        <label class="form-check-label small" for="tog-dyslexic"><i class="bi bi-fonts a11y-green-icon"></i> Fuente Dislexia</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-spacing" />
        <label class="form-check-label small" for="tog-spacing"><i class="bi bi-distribute-vertical a11y-green-icon"></i> Espaciado de Texto</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-links" />
        <label class="form-check-label small" for="tog-links"><i class="bi bi-link-45deg a11y-green-icon"></i> Resaltar Enlaces</label>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-cursor" />
        <label class="form-check-label small" for="tog-cursor"><i class="bi bi-cursor a11y-green-icon"></i> Cursor Grande</label>
      </div>
    </div>

    <!-- TAB 3: Animaciones -->
    <div
      id="panel-animaciones"
      class="a11y-tab-panel"
      role="tabpanel"
      aria-labelledby="tab-animaciones"
    >
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="tog-animations" />
        <label class="form-check-label small" for="tog-animations"><i class="bi bi-pause-circle a11y-green-icon"></i> Pausar Animaciones</label>
      </div>
    </div>
  </div>

  <!-- Footer del Panel -->
  <div
    class="a11y-panel-footer border-top d-flex align-items-center justify-content-between px-3 py-2"
  >
    <div class="d-flex align-items-center gap-2">
      <span class="badge rounded-circle p-1 a11y-status-dot"></span>
      <span class="small text-white-50">Guardado automáticamente</span>
    </div>
    <div class="d-none d-sm-block text-white-50 small"><kbd class="bg-dark text-white border border-secondary">Alt</kbd>+<kbd class="bg-dark text-white border border-secondary">A</kbd></div>
  </div>
</div>

<!-- ── Contenedores Globales para Guía de Lectura a Pantalla Completa ── -->
<div id="a11y-reading-guide" class="d-none" aria-hidden="true"></div>
<div id="a11y-focus-backdrop" class="d-none" aria-hidden="true"></div>

<!-- ── Toast de confirmación ── -->
<div
  id="a11y-toast"
  class="toast position-fixed border-0"
  role="status"
  aria-live="polite"
>
  <div class="d-flex align-items-center">
    <div class="toast-body small fw-semibold" id="a11y-toast-msg"></div>
    <button
      class="btn-close btn-close-white me-2 m-auto"
      data-bs-dismiss="toast"
      aria-label="Cerrar notificación"
    ></button>
  </div>
</div>

<script src="{% static 'js/accesibilidad.js' %}"></script>
